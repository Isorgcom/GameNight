# fail2ban filter: a scanner guessing paths through Nginx Proxy Manager.
#
# NPM writes one line per request to /opt/npm/data/logs/proxy-host-<n>_access.log:
#
#   [06/Nov/2026:09:23:55 +0000] - 404 404 - GET https gamenight.poker "/signup" [Client 86.109.75.34] [Length 125] [Gzip -] [Sent-to gamenight] "Mozilla/5.0 ..." "-"
#    ^time                        ^cache ^upstream ^status  ^method ^scheme ^host ^uri      ^the visitor
#
# A line whose status is 403 or 404 counts against the visitor in [Client ...].
# The jail (jail.d/npm-scan.conf) bans after 20 such lines inside two minutes:
# the sign-up scanner of 2026-11-06 produced 64 in two seconds before it found
# the form, and no person comes close. Only lines from the named proxy hosts
# are read; the proxy's fallback host writes a different format and is not covered.

[Definition]
failregex = ^\s*\S+ \S+ (?:403|404) - \S+ \S+ \S+ ".*?" \[Client <HOST>\]
ignoreregex =
datepattern = ^\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
