# fail2ban filter for the npm-blacklist jail. It matches nothing, on purpose.
#
# That jail is fed by hand (fail2ban-client set npm-blacklist banip ...) and
# reads no log; it has a filter only because every jail must name one, and a
# failregex must carry <HOST>. This one asks for NUL bytes that no text log holds.

[Definition]
failregex = ^\x00npm-blacklist\x00<HOST>\x00$
ignoreregex =
