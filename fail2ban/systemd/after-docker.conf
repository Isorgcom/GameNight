# Installed as /etc/systemd/system/fail2ban.service.d/after-docker.conf
# (see fail2ban/README.md, "Starting after Docker").
#
# Both jails ban into Docker's DOCKER-USER chain, which exists only once Docker
# is up. Started before it, fail2ban's restore of the saved bans fails with
# "Script error" and the jail reports bans the firewall does not hold.
[Unit]
After=docker.service
Wants=docker.service
